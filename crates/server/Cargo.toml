[package]
name = "crewsync-server"
version.workspace = true
edition.workspace = true
publish.workspace = true
license.workspace = true

[lints]
workspace = true

[dependencies]
crewsync-protocol = { version = "0.1.0-alpha.8", path = "../protocol" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"


toml = "0.8"
toml_edit = "0.22"
url = "2"
subtle = "2"
httparse = "1"

[dev-dependencies]
crewsync-client = { path = "../client" }
tempfile = "3"

[[test]]
name = "pilot"
path = "../../tests/e2e/pilot.rs"
