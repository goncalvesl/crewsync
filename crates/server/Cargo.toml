[package]
name = "crewsync-server"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
crewsync-protocol = { version = "0.1.0-dev", path = "../protocol" }
rustix = { version = "1", features = ["fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
crewsync-client = { path = "../client" }
tempfile = "3"

[[test]]
name = "pilot"
path = "../../tests/e2e/pilot.rs"
