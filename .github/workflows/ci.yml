name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check system dependencies
        run: |
          test -x /usr/bin/sha256sum
          /usr/bin/python3 -I -c 'import tomllib, ssl'
          openssl version
      - run: cargo build --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: TLS without sockets
        run: /usr/bin/python3 -I tests/e2e/tls_memory.py
      - name: HTTPS pilot with server and two clients
        timeout-minutes: 3
        run: cargo test -p crewsync-server --test pilot --locked -- --ignored
