name: Rust

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust stable
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - name: Check system dependencies
        run: |
          /usr/bin/python3 -I -c 'import ssl'
          cc --version
          openssl version
      - run: cargo build --workspace --locked
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: TLS without sockets
        run: |
          /usr/bin/python3 -I tests/e2e/tls_memory.py
          /usr/bin/python3 -I tests/e2e/cert_input.py
      - name: HTTPS pilot with server and two clients
        timeout-minutes: 3
        run: cargo test -p crewsync-server --test pilot --locked -- --ignored

      - run: python3 scripts/build-site.py
      - run: python3 tests/site/check.py target/site
      - run: python3 tests/site/test_build.py
      - name: Browser QA
        run: |
          npm install --prefix /tmp/crewsync-browser playwright@1.64.1
          node /tmp/crewsync-browser/node_modules/playwright/cli.js install --with-deps chromium
          python3 scripts/build-site.py --output target/site-root/crewsync
          python3 -m http.server 8765 --bind 127.0.0.1 --directory target/site-root > /tmp/crewsync-site.log 2>&1 &
          site_pid=$!
          trap 'kill "$site_pid"' EXIT
          PLAYWRIGHT_MODULE=/tmp/crewsync-browser/node_modules/playwright node tests/site/browser.cjs
