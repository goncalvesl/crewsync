name: Packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - run: cargo test --workspace --release --locked --target ${{ matrix.target }}
      - run: scripts/check-disk-full.sh target/${{ matrix.target }}/release/deps
      - name: HTTPS with packaged binaries
        timeout-minutes: 4
        run: cargo test -p crewsync-server --test pilot --release --locked --target ${{ matrix.target }} -- --ignored
      - run: python3 tests/packaging/test_install.py
      - run: python3 scripts/package.py --bin-dir target/${{ matrix.target }}/release --target ${{ matrix.target }}
      - run: python3 scripts/check-package.py target/packages/*.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/packages/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release gates
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f LICENSE
          python3 scripts/check-release.py "$TAG"
      - uses: actions/download-artifact@v4
        with:
          path: target/packages
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" target/packages/* --verify-tag --prerelease --latest=false --notes-file docs/RELEASE-NOTES.md
