name: Packages
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y musl-tools dpkg-dev rpm zstd
      - run: rustup toolchain install stable --profile minimal --component rustfmt --component clippy
      - run: rustup default stable && rustup target add ${{ matrix.target }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo build --workspace --release --locked --target ${{ matrix.target }}
      - run: cargo test --workspace --release --locked --target ${{ matrix.target }}
      - run: scripts/check-disk-full.sh target/${{ matrix.target }}/release/deps
      - name: HTTPS with packaged binaries
        timeout-minutes: 4
        run: cargo test -p crewsync-server --test pilot --release --locked --target ${{ matrix.target }} -- --ignored
      - run: python3 tests/packaging/test_install.py
      - run: python3 scripts/package.py --bin-dir target/${{ matrix.target }}/release --target ${{ matrix.target }}
      - run: python3 scripts/check-package.py target/packages/*.tar.gz
      - name: Build Debian and Fedora packages
        run: python3 scripts/package_system.py --bin-dir target/${{ matrix.target }}/release --arch ${{ startsWith(matrix.target, 'x86_64') && 'x86_64' || 'aarch64' }}
      - name: Verify package archives
        run: |
          for package in target/packages/*.deb; do dpkg-deb --info "$package" >/dev/null; done
          for package in target/packages/*.rpm; do rpm -qp --qf '%{NAME} %{VERSION} %{ARCH}\n' "$package"; done
          python3 scripts/check-system-packages.py --directory target/packages --arch ${{ startsWith(matrix.target, 'x86_64') && 'x86_64' || 'aarch64' }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: target/packages/*
  arch:
    needs: package
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: x86_64-unknown-linux-musl
          path: target/packages
      - name: Prepare Arch payload
        run: |
          mkdir target/arch-input
          tar -xzf target/packages/*linux-x86_64.tar.gz -C target/arch-input
          package_dir=$(find target/arch-input -mindepth 1 -maxdepth 1 -type d)
          python3 scripts/package-arch.py --bin-dir "$package_dir/bin" --output target/arch-build
      - name: Build and verify with makepkg
        run: |
          docker run --rm \
            -v "$PWD/target/arch-build:/input:ro" \
            -v "$PWD/target/packages:/output" \
            -v "$PWD:/source:ro" \
            archlinux:base-devel bash -euc '
              pacman -Syu --noconfirm
              for package in systemd shadow util-linux openssl; do pacman -Q "$package" >/dev/null; done
              for tool in systemctl useradd runuser python3; do command -v "$tool" >/dev/null; done
              useradd -m builder
              mkdir /build
              cp -a /input/. /build/
              chown -R builder:builder /build
              runuser -u builder -- bash -lc "cd /build && makepkg --noconfirm --cleanbuild"
              install -m 644 /build/crewsync-*.pkg.tar.zst /output/
              sha256sum /output/crewsync-*.pkg.tar.zst | sed "s|/output/||" > /tmp/crewsync-arch.sha256
              install -m 644 /tmp/crewsync-arch.sha256 /output/crewsync-arch.sha256.tmp
              package=$(find /output -maxdepth 1 -name "crewsync-*.pkg.tar.zst" -type f)
              mv /output/crewsync-arch.sha256.tmp "$package.sha256"
              python3 /source/scripts/check-arch-package.py "$package"
            '
      - uses: actions/upload-artifact@v4
        with:
          name: arch-x86_64
          path: target/packages/crewsync-*.pkg.tar.zst*
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: python3 scripts/package-source.py
      - run: python3 scripts/check-source.py target/packages/*-source.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: source
          path: target/packages/*
  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [package, arch, source]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release gates
        env:
          TAG: ${{ github.ref_name }}
        run: |
          test -f LICENSE
          python3 scripts/check-release.py "$TAG"
      - uses: actions/download-artifact@v4
        with:
          path: target/packages
          merge-multiple: true
      - name: Publish prerelease
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          cp scripts/setup-online.sh target/packages/install.sh
          (cd target/packages && sha256sum install.sh > install.sh.sha256)
          flags=(--latest)
          if [[ "$TAG" == *-alpha.* ]]; then flags=(--prerelease --latest=false); fi
          gh release create "$TAG" target/packages/* --verify-tag "${flags[@]}" --notes-file docs/RELEASE-NOTES.md
