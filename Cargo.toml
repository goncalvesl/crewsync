[workspace]
members = ["crates/server", "crates/client", "crates/protocol"]
resolver = "3"

[workspace.package]
version = "0.1.0-alpha.3"
edition = "2024"
publish = false
license = "GPL-3.0-only"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
crewsync-protocol = { path = "crates/protocol" }
